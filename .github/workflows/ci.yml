name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy Cloud Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: write
    concurrency:
      group: cloud-run-production
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: bamberg-landing
      GCP_REGION: southamerica-east1
      CLOUD_RUN_SERVICE: bamberg-landing
      IMAGE: southamerica-east1-docker.pkg.dev/bamberg-landing/containers/bamberg-landing
      WIF_PROVIDER: projects/739182328404/locations/global/workloadIdentityPools/github/providers/github
      WIF_SERVICE_ACCOUNT: github-deploy@bamberg-landing.iam.gserviceaccount.com
      CLOUD_RUN_RUNTIME_SA: cloud-run-runtime@bamberg-landing.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: southamerica-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --port=8080
            --memory=256Mi
            --cpu=1
            --timeout=30s
            --max-instances=3
            --min-instances=0
            --service-account=${{ env.CLOUD_RUN_RUNTIME_SA }}
            --ingress=all

      - run: echo "Service URL ${{ steps.deploy.outputs.url }}"
